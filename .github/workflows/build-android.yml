# Build APK บน GitHub Actions (Windows ใช้ buildozer ตรงๆ ไม่ได้)
name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  APP_DIR: "."

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Install buildozer
        run: pip install buildozer==1.5.0 cython==0.29.36

      - name: Cache buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ${{ env.APP_DIR }}/.buildozer
          key: buildozer-${{ hashFiles(format('{0}/buildozer.spec', env.APP_DIR)) }}

      # ✅ เซ็นด้วยกุญแจเดียวกับที่ใช้ build ในเครื่อง (เก็บเป็น base64 ใน repo secret ANDROID_KEYSTORE_B64)
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ไม่มี secret ANDROID_KEYSTORE_B64 — APK จะเซ็นด้วยกุญแจสุ่มและติดตั้งทับเวอร์ชันเดิมไม่ได้"
            exit 1
          fi
          mkdir -p ~/.android
          echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore

      - name: Build APK
        working-directory: ${{ env.APP_DIR }}
        run: yes | buildozer -v android debug

      - name: Rename APK
        working-directory: ${{ env.APP_DIR }}
        run: cp bin/*.apk bin/AuthenAPI.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AuthenAPI-apk
          path: ${{ env.APP_DIR }}/bin/AuthenAPI.apk
